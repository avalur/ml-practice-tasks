name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check tasks/ is generated from problems/
        run: python generate.py --check
      - name: Check web content is generated from problems/
        run: python export_web.py --check
      - name: Check class decks are generated from classes/
        run: python export_decks.py --check
      # Compares recorded source hashes, so it needs no LaTeX here.
      - name: Check TikZ figures are rebuilt from figures/
        run: python tools/build_figures.py --check
      - name: Run reference solutions
        run: pytest problems -q

  # The node:test suites import src/lib/*.ts directly, which needs Node's
  # built-in type stripping (22.6+, on by default from 23.6). The web job stays
  # on Node 20 to match the build, so these get a job of their own.
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (sanitizer, submissions, grading)
        run: node --test tests/*.test.mjs

  web:
    runs-on: ubuntu-latest
    needs: python
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy secret so Auth.js initializes in CI; no real OAuth flow is tested.
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlp_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mlp_test
      # The brain-teaser tests read a draft board, which only a site editor can
      # see. Synthetic address, throwaway database — this grants nothing real.
      ADMIN_EMAILS: e2e-admin@example.test
      # Lets the Studio's AI test point a teacher's "own key" at a mock model on
      # localhost. Production leaves it unset, which refuses private addresses.
      AI_ALLOW_PRIVATE_BASE_URL: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync database schema
        run: pnpm prisma db push --skip-generate
      # Classes are seeded from classes/manifest.json, so a class page can tell
      # "you are not enrolled" apart from "no such class" (which is a 404).
      - name: Seed classes
        run: node scripts/sync-classes.cjs
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      # Only the browser, not --with-deps: that runs apt-get for fonts and
      # libraries ubuntu-latest already has (it ships Google Chrome), and it is
      # what broke CI whenever the runner could not reach the Ubuntu mirrors.
      # The browser itself is cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Run e2e (in-browser Pyodide runner)
        run: pnpm exec playwright test
